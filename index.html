<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calcContainer">
        <div class="calcBody">
            <div class="display"><span class="displayText">56+59</span></div>
            <div class="btnContainer">
                <div class="bigBtn">Clear</div>
                <div class="calcBtns">⌫</div>
                <div class="calcBtns">/</div>
                <div class="calcBtns">9</div>
                <div class="calcBtns">8</div>
                <div class="calcBtns">7</div>
                <div class="calcBtns">*</div>
                <div class="calcBtns">6</div>
                <div class="calcBtns">5</div>
                <div class="calcBtns">4</div>
                <div class="calcBtns">-</div>
                <div class="calcBtns">3</div>
                <div class="calcBtns">2</div>
                <div class="calcBtns">1</div>
                <div class="calcBtns">+</div>
                <!-- <div class="calcBtns display-none">+</div> -->
                <!-- <div class="calcBtns display-none"></div> -->
                <div class="bigBtn">0</div>
                <div class="calcBtns">.</div>
                <div class="calcBtns">=</div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
